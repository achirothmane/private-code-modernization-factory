name: Wave 7F Real Semantic Survivor

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Fetch pinned Wave 7F corpus
        run: python benchmarks/fetch_corpus.py benchmarks/wave7f-corpus.json .wave7f-corpus
      - name: Run Wave 7F benchmark
        run: |
          modfactory benchmark .wave7f-corpus \
            --manifest benchmarks/wave7f-corpus.json \
            --output wave7f-results
      - name: Build model-evaluation plan
        run: |
          modfactory eval-plan .wave7f-corpus/auth0-node-wsfed-request-tests \
            --output wave7f-eval
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modfactory-wave7f-semantic-survivor
          path: |
            wave7f-results/benchmark/
            wave7f-eval/model-eval/
          if-no-files-found: error
