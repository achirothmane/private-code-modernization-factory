name: External Patch Evidence

on:
  workflow_dispatch:
  push:
    paths:
      - "benchmarks/run_external_patch_evidence.py"
      - ".github/workflows/external-patch-evidence.yml"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -e .
      - name: Run external patch evidence benchmark
        run: python benchmarks/run_external_patch_evidence.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-patch-evidence
          path: benchmark-results/external-patch-evidence/
          if-no-files-found: warn
