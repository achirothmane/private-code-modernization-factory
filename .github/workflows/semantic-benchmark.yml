name: Wave 7E Deterministic React Benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Fetch pinned real-semantic corpus
        run: python benchmarks/fetch_corpus.py benchmarks/semantic-corpus.json .semantic-corpus
      - name: Run static benchmark
        run: |
          modfactory benchmark .semantic-corpus \
            --manifest benchmarks/semantic-corpus.json \
            --output semantic-benchmark-results
      - name: Build post-deterministic model evaluation plan
        run: |
          modfactory eval-plan .semantic-corpus/h2oai-wave-reactdom \
            --target react-dom=18 \
            --output wave7e-model-eval
      - name: Export Wave 7E real deterministic proposals
        run: |
          python benchmarks/export_wave7e_react_proposals.py \
            .semantic-corpus/h2oai-wave-reactdom \
            wave7e-react-proposals
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modfactory-wave7e-deterministic-react
          path: |
            semantic-benchmark-results/benchmark/
            wave7e-model-eval/model-eval/
            wave7e-react-proposals/
          if-no-files-found: error
