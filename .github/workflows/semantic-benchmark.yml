name: Wave 7D Target Profile Benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Fetch pinned real-semantic corpus
        run: python benchmarks/fetch_corpus.py benchmarks/semantic-corpus.json .semantic-corpus
      - name: Run static benchmark
        run: |
          modfactory benchmark .semantic-corpus \
            --manifest benchmarks/semantic-corpus.json \
            --output semantic-benchmark-results
      - name: Build Wave 7D model evaluation plan
        run: |
          modfactory eval-plan .semantic-corpus/h2oai-wave-reactdom \
            --target react-dom=18 \
            --output wave7d-model-eval
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modfactory-wave7d-target-profile
          path: |
            semantic-benchmark-results/benchmark/
            wave7d-model-eval/model-eval/
          if-no-files-found: error
