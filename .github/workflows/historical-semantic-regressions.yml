name: Historical Semantic Regressions

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "benchmarks/run_historical_semantic_regressions.py"
      - ".github/workflows/historical-semantic-regressions.yml"
  push:
    paths:
      - "benchmarks/run_historical_semantic_regressions.py"
      - ".github/workflows/historical-semantic-regressions.yml"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Run historical semantic regression benchmark
        run: python benchmarks/run_historical_semantic_regressions.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-semantic-regressions
          path: benchmark-results/historical-semantic-regressions/
          if-no-files-found: warn
