name: Static Scale Benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - wave7b-evidence-refinement
    paths:
      - ".github/workflows/benchmark.yml"
      - "benchmarks/**"
      - "src/modfactory/**"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Fetch pinned static corpus
        run: python benchmarks/fetch_corpus.py benchmarks/corpus.json .benchmark-corpus
      - name: Run static benchmark
        run: |
          modfactory benchmark .benchmark-corpus \
            --manifest benchmarks/corpus.json \
            --output benchmark-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modfactory-static-benchmark
          path: benchmark-results/benchmark/
          if-no-files-found: error
