name: Market Snapshot Oracle

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "benchmarks/run_market_snapshot_oracle.py"
      - ".github/workflows/market-snapshot-oracle.yml"
  push:
    paths:
      - "benchmarks/run_market_snapshot_oracle.py"
      - ".github/workflows/market-snapshot-oracle.yml"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Run market snapshot-oracle benchmark
        run: python benchmarks/run_market_snapshot_oracle.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: market-snapshot-oracle
          path: benchmark-results/market-snapshot-oracle/
          if-no-files-found: warn