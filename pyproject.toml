[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modfactory"
version = "0.1.0"
description = "Evidence-first repository modernization analyzer and migration planner"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Modernization Factory"}]
keywords = ["modernization", "migration", "static-analysis", "ci", "legacy-code"]

[project.scripts]
modfactory = "modfactory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
